name: Django CI

on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jims_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d jims_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/jims_ci
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: github-actions-test-only-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PLAYWRIGHT_BROWSER_CHANNEL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install PDF runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install test dependencies and browser
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            git diff --check origin/main...HEAD
          fi
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Validate fresh PostgreSQL migration path
        run: python manage.py migrate --noinput
      - name: Focused inventory and receipt regressions
        run: python manage.py test inventory.tests_cart_workspace inventory.tests_cart_lifecycle inventory.tests_cart_checkout inventory.tests_cart_line_merge inventory.tests_financial_controls inventory.tests_walk_in_identity billing.tests_receipt_totals --keepdb --noinput
      - name: Full Django suite
        run: python manage.py test --keepdb --noinput --parallel 4
      - name: Cache the UI CDN script for browser routing
        run: |
          mkdir -p .backups/cart-checkout
          curl --fail --location --retry 3 https://cdn.tailwindcss.com -o .backups/cart-checkout/tailwind.js
      - name: Browser workspace and checkout smoke checks
        run: python manage.py test inventory.browser_cart_workspace inventory.browser_cart_checkout --keepdb --noinput
