name: Django CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/unified-purchasing-rc
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: js_internetservices
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d js_internetservices"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/js_internetservices
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: github-actions-test-only-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install PDF runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Test walk-in customer regression
        run: python manage.py test inventory.tests_walk_in_identity --keepdb
      - name: Run full test suite
        run: python manage.py test --keepdb
