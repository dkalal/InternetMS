{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}<div class="jims-form-page jims-form-page--compact space-y-5">
<h1 class="jims-page-title">{{ title }}</h1><p>{{ description }}</p>
<form method="post" class="jims-form-section space-y-4 p-5">{% csrf_token %}{{ form.non_field_errors }}
{% for field in form %}{% include 'components/form_field.html' with field=field %}{% endfor %}
<button type="submit" class="jims-btn jims-btn-primary">Record physical stock change</button>
</form></div>{% endblock %}
