{% load humanize number_display %}
{% if cart.status == "draft" and lines %}
  <button class="jims-btn jims-btn-quiet" type="submit"
          form="cart-details-form-{{ cart.pk }}"
          formaction="{% url 'inventory:cart_convert' cart.pk 'quotation' %}"
          data-pos-convert>Save as quotation</button>
  <button class="jims-btn jims-btn-primary pos-pay-button w-full" type="submit"
          form="cart-details-form-{{ cart.pk }}"
          formaction="{% if can_register_payment %}{% url 'inventory:cart_checkout' cart.pk %}{% else %}{% url 'inventory:cart_convert' cart.pk 'invoice' %}{% endif %}"
          data-pos-convert
          data-confirm="{% if can_register_payment %}Confirm full payment using the selected payment method? This completes the sale and deducts stock.{% else %}Create an invoice with the sale details shown here? Stock is deducted only after full payment.{% endif %}"
          data-confirm-title="Confirm final sale details"
          data-confirm-action="{% if can_register_payment %}Confirm payment{% else %}Create invoice{% endif %}"
          data-loading-label="{% if can_register_payment %}Completing sale...{% else %}Creating invoice...{% endif %}">
    <span>{% if can_register_payment %}Confirm payment &amp; view receipt{% else %}Create invoice{% endif %}</span>
    <span class="pos-pay-amount"><span data-pos-payment-total>{{ grand_total|money_display }}</span> TZS</span>
  </button>
{% elif cart.quotation %}
  <a class="jims-btn jims-btn-primary w-full" href="{% url 'billing:document_detail' 'quotation' cart.quotation.pk %}">Open quotation {{ cart.quotation.number }}</a>
{% elif cart.invoice %}
  <a class="jims-btn jims-btn-primary w-full" href="{% url 'billing:document_detail' 'invoice' cart.invoice.pk %}">Open invoice {{ cart.invoice.number }}</a>
{% endif %}
