<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block print_title %}RECEIPT {{ document.number }}{% endblock %}</title>
  <style>
    @page {
      size: 80mm auto;
      margin: 4mm;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      color: #000000;
      background: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      line-height: 1.3;
    }

    .paper {
      width: 72mm;
      max-width: 100%;
      padding: 0;
      margin: 0 auto;
      overflow: hidden;
    }

    @media print {
      .print-controls { display: none !important; }
      body {
        width: 72mm;
        margin: 0 auto;
      }
    }

    @media screen {
      body { padding: 18px 8px; }
      .print-controls {
        width: min(72mm, 100%);
        margin: 0 auto 16px;
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      .print-controls button,
      .print-controls a {
        border: 1px solid #111;
        background: #fff;
        color: #111;
        padding: 8px 12px;
        font: 600 13px Arial, sans-serif;
        text-decoration: none;
        cursor: pointer;
      }
      .print-controls button { background: #111; color: #fff; }
    }

    .center {
      text-align: center;
    }

    .sep {
      margin: 7px 0;
      border-top: 1px dashed #000;
      height: 0;
    }

    .sep-solid {
      margin: 7px 0;
      border-top: 1px solid #000;
      height: 0;
    }

    .kvs {
      width: 100%;
      border-collapse: collapse;
    }

    .kvs td {
      padding: 1px 0;
      vertical-align: top;
    }

    .k {
      width: 48%;
    }

    .v {
      width: 52%;
      text-align: right;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .items {
      width: 100%;
      border-collapse: collapse;
    }

    .items th,
    .items td {
      padding: 2px 0;
      vertical-align: top;
    }

    .items th {
      font-weight: 700;
      border-bottom: 1px solid #000;
    }

    .items .qty {
      text-align: right;
      width: 24%;
      padding-left: 6px;
    }

    .items .amt {
      text-align: right;
      width: 31%;
      padding-left: 6px;
    }

    .items .desc {
      width: 45%;
      padding-right: 6px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .items tr,
    .totals,
    footer {
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .totals {
      width: 100%;
      border-collapse: collapse;
    }

    .totals td {
      padding: 2px 0;
    }

    .totals .label {
      width: 60%;
    }

    .totals .value {
      width: 40%;
      text-align: right;
    }

    .total-strong {
      font-weight: 800;
      border-top: 1px solid #000;
      padding-top: 4px;
    }

    .small {
      font-size: 10px;
    }

    .qr-wrap {
      margin-top: 10px;
    }

    .qr {
      display: block;
      width: 160px;
      height: 160px;
      margin: 0 auto;
      border: 1px solid #000;
    }

    .legal-line {
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .nowrap {
      white-space: nowrap;
    }
  </style>
</head>
<body>
  {% if browser_print %}
    <nav class="print-controls" aria-label="Receipt actions">
      <button type="button" onclick="window.print()">Print Receipt</button>
      <a href="{% url 'billing:document_detail' doc_type='receipt' pk=document.pk %}">Back</a>
    </nav>
  {% endif %}
  <div class="paper">
    {% block print_content %}{% endblock %}
  </div>
</body>
</html>
