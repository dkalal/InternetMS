<div class="min-w-0">
  <label for="{{ field.id_for_label }}" class="inline-flex min-h-11 cursor-pointer items-center gap-2 text-sm font-medium text-slate-700">
    {{ field }}<span>{{ field.label }}</span>
  </label>
  {% if field.errors %}<div id="{{ field.auto_id }}_errors" class="text-sm text-rose-600" role="alert">{% for error in field.errors %}<p>{{ error }}</p>{% endfor %}</div>{% endif %}
</div>
