<div class="jims-inside-caption {% if field.value or field.value == 0 %}has-value{% endif %}" data-inside-caption>
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-rose-600">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text and not hide_help %}<p id="{{ field.auto_id }}_helptext" class="mt-1 text-xs text-slate-500">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<div id="{{ field.auto_id }}_errors" class="mt-1 text-sm text-rose-600" role="alert">{% for error in field.errors %}<p>{{ error }}</p>{% endfor %}</div>{% endif %}
</div>
