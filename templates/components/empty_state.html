<div class="px-5 py-12 text-center">
  <div class="mx-auto flex h-11 w-11 items-center justify-center rounded-full bg-brand-50 text-brand-700" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" class="h-5 w-5">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z"/>
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="m4 7.5 8 4.5 8-4.5M12 12v9"/>
    </svg>
  </div>
  <h3 class="mt-3 text-sm font-semibold text-slate-900">{{ title }}</h3>
  {% if message %}<p class="mx-auto mt-1 max-w-md text-sm text-slate-600">{{ message }}</p>{% endif %}
  {% if action_url and action_label %}<a href="{{ action_url }}" class="jims-btn jims-btn-primary mt-4">{{ action_label }}</a>{% endif %}
</div>
